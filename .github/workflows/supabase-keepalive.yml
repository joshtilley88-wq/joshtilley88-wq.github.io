# Keeps the free Supabase project (invoicing app cloud sync) from pausing.
# Free projects pause after 7 days with no activity. This makes one tiny
# anonymous call each day to the public heartbeat() function (it reads/writes
# nothing private). Uses only the public publishable key.
# Note: GitHub turns off scheduled workflows after 60 days with no commits to
# the repo; if that happens, re-enable it under Actions -> Supabase keep-alive.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC (about 2pm Sydney)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call heartbeat()
        run: |
          set -eu
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
              'https://opekqrldytqvjziowbqo.supabase.co/rest/v1/rpc/heartbeat' \
              -H 'apikey: sb_publishable_Kx9Q3ammN998eEFj6uJ8Sw_QZ8bl99w' \
              -H 'Content-Type: application/json' -d '{}') || code=000
            echo "HTTP $code: $(cat /tmp/out.txt 2>/dev/null)"
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 30
          done
          exit 1
